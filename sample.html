<!DOCTYPE html>
<html>
<head>
    <title>HTML Input Types</title>
</head>
<body>

<h2>HTML Input Types Example</h2>

<form>

    Name:
    <input type="text" placeholder="Enter your name"><br><br>

    Password:
    <input type="password" placeholder="Enter password"><br><br>

    Email:
    <input type="email" placeholder="Enter email"><br><br>

    Phone:
    <input type="tel" placeholder="Enter phone number"><br><br>

    Number:
    <input type="number" min="1" max="100"><br><br>

    Date:
    <input type="date"><br><br>

    Time:
    <input type="time"><br><br>

    Date & Time:
    <input type="datetime-local"><br><br>

    Month:
    <input type="month"><br><br>

    Week:
    <input type="week"><br><br>

    Color:
    <input type="color"><br><br>

    Range:
    <input type="range" min="0" max="100"><br><br>

    Website:
    <input type="url" placeholder="https://example.com"><br><br>

    Search:
    <input type="search" placeholder="Search here"><br><br>

    Upload File:
    <input type="file"><br><br>

    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female<br><br>

    Hobbies:
    <input type="checkbox"> Reading
    <input type="checkbox"> Sports<br><br>

    Hidden:
    <input type="hidden" value="12345">

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
    <input type="button" value="Click Me">

</form>
<!DOCTYPE html>
<html>
<head>
    <title>Password Example</title>

<body>

<br><br>

</body>
</html>

</body>
</html>
